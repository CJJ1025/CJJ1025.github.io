# Hexo Configuration | Hexo 配置
## Docs | 文档: https://hexo.io/docs/configuration.html
## Source | 来源: https://github.com/hexojs/hexo/

# Site | 站点
title: CJJ的小站
subtitle: ''
description: CJJ的个人博客，分享技术分析和生活记录
keywords: CJJ,个人博客,技术分析,生活记录
author: CJJ
language: zh-CN
timezone: Asia/Shanghai

# URL | 网址
## Set your site url here | 在此设置你的站点地址
## For example, if you use GitHub Page, set url as 'https://username.github.io/project'
## 例如：如果使用 GitHub Pages，请将 url 设为 'https://username.github.io/project'
url: https://cjj25.space
permalink: :year/:month/:day/:title/ # 文章永久链接格式 | Post permalink format
permalink_defaults: # 永久链接默认值 | Permalink defaults
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks | 设为 false 可去除链接末尾的 index.html
  trailing_html: true # Set to false to remove trailing '.html' from permalinks | 设为 false 可去除链接末尾的 .html

# Directory | 目录
source_dir: source # 源文件目录 | Source folder
public_dir: public # 构建产物目录 | Build output folder
tag_dir: tags # 标签目录 | Tag directory
archive_dir: archives # 归档目录 | Archive directory
category_dir: categories # 分类目录 | Category directory
code_dir: downloads/code # include 代码目录 | Include code directory
i18n_dir: :lang # 国际化目录 | I18n directory
skip_render: # 跳过渲染的路径（原样复制到 public）| Paths to skip rendering (copied as-is)

# Writing | 写作
new_post_name: :title.md # 新文章的文件名格式 | File name format of new posts
default_layout: post # 默认布局 | Default layout
titlecase: false # 标题自动转为首字母大写（英文）| Transform title into titlecase
external_link:
  enable: true # 在新标签页打开外部链接 | Open external links in new tab
  field: site # 应用范围：site 全站 / post 仅文章 | Apply to the whole site or posts only
  exclude: '' # 排除的链接 | Excluded links
filename_case: 0 # 文件名大小写：0 不转换 / 1 小写 / 2 大写 | 0 none, 1 lowercase, 2 uppercase
render_drafts: false # 是否渲染草稿 | Render drafts or not
post_asset_folder: false # 开启文章资源文件夹（每篇文章同名文件夹）| Enable post asset folder
relative_link: false # 是否使用相对链接 | Make links relative
future: true # 是否显示未来日期的文章 | Display future-dated posts
syntax_highlighter: highlight.js # 代码高亮引擎 | Syntax highlighter engine
highlight:
  line_number: true # 显示代码行号 | Show line numbers
  auto_detect: false # 自动检测代码语言 | Auto detect code language
  tab_replace: '' # Tab 替换成的字符 | Replace tabs with
  wrap: true # 代码自动换行 | Wrap long lines
  hljs: false # 使用 hljs-* 类名 | Use hljs-* class names
prismjs:
  preprocess: true # 预处理模式 | Preprocess mode
  line_number: true # 显示代码行号 | Show line numbers
  tab_replace: '' # Tab 替换成的字符 | Replace tabs with

# Home page setting | 首页设置
# path: 首页根路径（默认 ''）| Root path for your blogs index page (default = '')
# per_page: 每页文章数（0 = 关闭分页）| Posts displayed per page (0 = disable pagination)
# order_by: 排序方式（默认按日期倒序）| Posts order (date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag | 分类与标签
default_category: uncategorized # 未分类时的默认分类 | Default category
category_map: # 分类别名映射 | Category alias map
tag_map: # 标签别名映射 | Tag alias map

# Metadata elements | 元数据标签
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true # 是否输出 generator meta 标签 | Output generator meta tag

# Date / Time format | 日期 / 时间格式
## Hexo uses Moment.js to parse and display date | Hexo 使用 Moment.js 解析和显示日期
## You can customize the date format as defined in | 自定义日期格式参见
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty' | 可选值：mtime 文件修改时间 / date 文章日期 / empty 不显示
updated_option: 'mtime'

# Pagination | 分页
## Set per_page to 0 to disable pagination | 将 per_page 设为 0 可关闭分页
per_page: 10
pagination_dir: page # 分页目录名 | Pagination directory

# Include / Exclude file(s) | 包含 / 排除文件
## include:/exclude: options only apply to the 'source/' folder | 仅对 source/ 目录生效
include:
exclude:
ignore:

# Extensions | 扩展
## Plugins | 插件: https://hexo.io/plugins/
## Themes | 主题: https://hexo.io/themes/
theme: butterfly # 当前使用主题 | Current theme

# Deployment | 部署
## Docs | 文档: https://hexo.io/docs/one-command-deployment
## 本站由 Vercel 读取 vercel.json 自动构建，此段保持为空即可
## This site is built automatically by Vercel via vercel.json; leave this section empty
deploy:
  type: ''
