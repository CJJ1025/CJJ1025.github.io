# Butterfly 主题用户配置（会覆盖主题默认配置）
# 完整配置项见：node_modules/hexo-theme-butterfly/_config.yml
# 官方文档：https://butterfly.js.org/

# ===== 顶部导航栏 | Navigation menu =====
# 格式：显示文字: 路径 || 图标（Font Awesome）
# 路径里如果出现中文需要写带 slug 的形式，比如 /2026/09/27/stm32-zhuan-lan-suo-yin/
# 也可以用 url_for 友好的相对路径：{% post_link slug "显示文字" %} 不支持 menu，menu 写绝对路径
menu:
  首页: / || fas fa-home
  STM32专栏: /2026/09/27/stm32-series-index/ || fas fa-microchip
  算法题: /categories/算法学习/ || fas fa-code
  C++: /categories/C-学习/ || fas fa-cogs
  嵌入式: /categories/嵌入式学习/ || fas fa-microchip
  关于我: /about/ || fas fa-user

# ===== 头像与顶部横幅 | Avatar & Banner =====
avatar:
  img: /img/avatar.jpg
  effect: false

# 首页顶部横幅（#page-header 背景），随机二次元图 API，每次刷新换一张
index_img: https://t.alcy.cc/fj

# ===== CDN 加速（国内访问优化）=====
# 主题默认第三方库走 jsdelivr，国内不稳定，改为七牛 staticfile CDN
CDN:
  internal_provider: local
  third_party_provider: custom
  version: true
  custom_format: https://cdn.staticfile.org/${cdnjs_name}/${version}/${min_cdnjs_file}

# ===== 本地搜索 =====
# 依赖 hexo-generator-search（已安装），搜索索引在构建时生成为 /search.xml
# 注意：Butterfly 5.x 用 search.use 指定搜索方式（旧版的 local_search.enable 已废弃）
search:
  use: local_search

# ===== 文章页设置 | Post page =====
# 关闭每篇文章底部的版权声明卡片（文章作者/链接/版权声明）
post_copyright:
  enable: false

# ===== Mermaid 图表 =====
# 用 {% mermaid %} ... {% endmermaid %} 标签书写流程图/时序图
# 注意：不要用 ```mermaid 代码块——主题的代码块自动转换要求渲染器输出
# <pre><code class="mermaid">，而 hexo 默认 highlight 输出的是表格结构，匹配不上会显示成纯文本
mermaid:
  enable: true
  code_write: true          # true = 图表由 {% mermaid %} 标签生成（保持 true）
  theme:
    light: default          # 浅色主题：default / forest / neutral
    dark: dark              # 深色主题

# ===== KaTeX 数学公式 =====
# 用 $...$ 行内公式、$$...$$ 块公式
# 配合 hexo-renderer-kramed 插件（已装）：npm install hexo-renderer-kramed --save
# kramed 会把 $...$ 转成 <span class="math math-inline">...</span>，下面两段 CDN 让 KaTeX 在浏览器里渲染
# Butterfly 5.x 的 math 顶层配置（注意不是 katex:）
math:
  use: katex                 # 可选 katex / mathjax；这里用 KaTeX（轻、快）
  per_page: true             # 全站启用（设为 false 时，需要在文章的 front-matter 里加 math: true 才加载）
  hide_scrollbar: false
  katex:
    copy_tex: false          # 公式右键复制功能
  # CDN 走 jsdelivr（fast_get 等你访问页面时临时加载，不进 hexo 构建产物）
  # 也可以用 CDN 配置里的 staticfile：https://cdn.staticfile.org/katex/...

# ===== 系列 / 专栏 =====
# 启用 Butterfly 系列的「侧边栏系列卡片」需要这个顶层 enable = true
# 文章里 front-matter 加 series: 系列名 即可自动归类
series:
  enable: true
  orderBy: date             # 按发布日期排序（也可用 title 按标题排）
  order: 1                  # 1 升序（旧→新），-1 降序
  number: false             # 数字编号

# ===== 侧边栏 | Sidebar =====
aside:
  card_author:
    enable: true
    # 头像在文件顶部的 avatar.img 统一配置
    description: CJJ的个人博客，分享技术分析和生活记录
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/CJJ1025 # 你的 GitHub 主页
  # 关闭侧边栏公告卡片
  card_announcement:
    enable: false
  # 开启系列卡片（需要文章 front-matter 中带 `series:` 字段）
  card_post_series:
    enable: true
    series_title: 系列文章

# ===== 自定义注入 | Inject =====
inject:
  head:
    # 隐藏首页全屏横幅中央的站点大标题（只作用于首页 full_page，文章页标题保留）
    # 注意：值必须加引号，否则 CSS 选择器里 " #" 会被 YAML 当成注释截断
    - '<style>#page-header.full_page #site-info{display:none}</style>'
    # 首页文章封面：完整显示图片、等比缩放不裁剪（contain），加 !important 覆盖主题默认的 cover
    # 想恢复默认填满裁剪把 contain 改成 cover，或删掉这行
    - '<style>.recent-post-item img.post-bg{object-fit:contain!important}.recent-post-item:hover img.post-bg{transform:scale(1.08)}</style>'

# ===== 背景特效 | Background effects =====
# 彩色丝带 | canvas_ribbon
# See: https://github.com/hustcc/ribbon.js
canvas_ribbon:
  enable: false
  size: 150        # 丝带大小 | Ribbon size
  alpha: 0.6       # 透明度 0~1 | Opacity (0 ~ 1)
  zIndex: -1
  click_to_change: false  # 点击换色 | Click to change color
  mobile: true     # 手机端启用 | Enable on mobile
