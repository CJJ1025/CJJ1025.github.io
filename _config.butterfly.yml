# Butterfly 主题用户配置（会覆盖主题默认配置）
# 完整配置项见：node_modules/hexo-theme-butterfly/_config.yml
# 官方文档：https://butterfly.js.org/

# ===== 头像与顶部横幅 | Avatar & Banner =====
avatar:
  img: /img/avatar.jpg
  effect: false

# 首页顶部横幅（#page-header 背景），随机二次元图 API，每次刷新换一张
index_img: https://t.alcy.cc/fj

# ===== CDN 加速（国内访问优化）=====
# 主题默认第三方库走 jsdelivr，国内不稳定，改为七牛 staticfile CDN
CDN:
  internal_provider: local
  third_party_provider: custom
  version: true
  custom_format: https://cdn.staticfile.org/${cdnjs_name}/${version}/${min_cdnjs_file}

# ===== 本地搜索 =====
# 依赖 hexo-generator-search（已安装），搜索索引在构建时生成为 /search.xml
# 注意：Butterfly 5.x 用 search.use 指定搜索方式（旧版的 local_search.enable 已废弃）
search:
  use: local_search

# ===== 文章页设置 | Post page =====
# 关闭每篇文章底部的版权声明卡片（文章作者/链接/版权声明）
post_copyright:
  enable: false

# ===== 侧边栏 | Sidebar =====
aside:
  card_author:
    enable: true
    # 头像在文件顶部的 avatar.img 统一配置
    description: CJJ的个人博客，分享技术分析和生活记录
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/CJJ1025 # 你的 GitHub 主页
  # 关闭侧边栏公告卡片
  card_announcement:
    enable: false

# ===== 自定义注入 | Inject =====
inject:
  head:
    # 隐藏首页全屏横幅中央的站点大标题（只作用于首页 full_page，文章页标题保留）
    # 注意：值必须加引号，否则 CSS 选择器里 " #" 会被 YAML 当成注释截断
    - '<style>#page-header.full_page #site-info{display:none}</style>'
    # 首页文章封面：完整显示图片、等比缩放不裁剪（contain），加 !important 覆盖主题默认的 cover
    # 想恢复默认填满裁剪把 contain 改成 cover，或删掉这行
    - '<style>.recent-post-item img.post-bg{object-fit:contain!important}.recent-post-item:hover img.post-bg{transform:scale(1.08)}</style>'

# ===== 背景特效 | Background effects =====
# 彩色丝带 | canvas_ribbon
# See: https://github.com/hustcc/ribbon.js
canvas_ribbon:
  enable: false
  size: 150        # 丝带大小 | Ribbon size
  alpha: 0.6       # 透明度 0~1 | Opacity (0 ~ 1)
  zIndex: -1
  click_to_change: false  # 点击换色 | Click to change color
  mobile: true     # 手机端启用 | Enable on mobile
